<div class="page-layer" [style.min-height.px]="contentHeight()">
  @for (item of items(); track key(item)) {
    @if (isContainer(item)) {
      <div class="widget-cell container" [class.root]="root()" [style]="item.layout">
        <app-absolute-widget-renderer
          [items]="item.children ?? []"
          [contentHeight]="0"
          [root]="false" />
      </div>
    } @else {
      <div class="widget-cell" [class.root]="root()" [style]="item.layout">
        <div class="widget">
          <ng-container *ngComponentOutlet="component(item); inputs: { id: key(item), props: props(item) }" />
        </div>
      </div>
    }
  }
</div>
