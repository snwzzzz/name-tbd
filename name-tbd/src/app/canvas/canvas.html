<div class="canvas-layout">
  <!-- ─── RIGHT: canvas area ───────────────────────────────────────────── -->
  <div class="canvas-area">
    <!-- Infinite-canvas viewport -->
    <div
      class="canvas-viewport"
      #viewport
      [class.is-panning]="isPanning()"
      (mousedown)="onViewportMouseDown($event)"
      (mousemove)="onViewportMouseMove($event)"
    >
      <!-- Floating Zoom Controls in the Corner -->
      <div class="zoom-controls floating">
        <button class="zoom-btn" (click)="zoomOut()" title="Zoom out">−</button>
        <button class="zoom-btn zoom-pct" (click)="zoomReset()" title="Reset to 100%">
          {{ zoomPercent() }}%
        </button>
        <button class="zoom-btn" (click)="zoomIn()" title="Zoom in">+</button>
        <div class="zoom-divider"></div>
        <button class="zoom-btn" (click)="zoomFit()" title="Fit (F)">Fit</button>
      </div>

      <!-- The artboard: native zoom scaling to keep Drag and Drop working natively -->
      <div class="artboard" [style.zoom]="zoom()" [style.transform]="artboardTransform()">
        <!-- GridStack mounts here.
             column:24 · cellHeight:45px · row:18  →  1440×810px exactly 16:9
             One grid cell (1×1) = 60×45px
             Typical button (w:2, h:1) = 120×45px cell / ~112×37px content  -->
        <div class="grid-stack" #gridContainer></div>
      </div>

      <!-- Layout-state debug overlay (remove or gate behind a flag in production) -->
      <!-- 
      @if (layout().length > 0) {
        <div class="debug-overlay">
          <div class="debug-header">
            <span class="debug-title">LAYOUT STATE</span>
            <span class="debug-count"
              >{{ layout().length }} item{{ layout().length !== 1 ? 's' : '' }}</span
            >
          </div>
          <pre class="debug-json">{{ layout() | json }}</pre>
        </div>
      }
        -->
    </div>
  </div>

  <!-- Custom Context Menu -->
  @if (contextMenuState(); as ctx) {
    <div
      class="custom-context-menu"
      [style.left.px]="ctx.x"
      [style.top.px]="ctx.y"
      (click)="$event.stopPropagation()"
    >
      <div class="menu-item" (click)="addLogicToItem(ctx.item)">⚡ Add Logic / Edit Action</div>
    </div>
  }
</div>
