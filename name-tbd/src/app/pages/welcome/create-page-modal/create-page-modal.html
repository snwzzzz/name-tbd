<div class="create-page-modal">
  <div class="modal-header">
    <h3 class="modal-title">Create New Page</h3>
  </div>

  <div class="modal-body">
    <div class="form-group">
      <label for="page-name-input">Page Name</label>
      <input
        id="page-name-input"
        type="text"
        [(ngModel)]="name"
        placeholder="e.g. Dashboard"
        (keydown.enter)="onSubmit()"
        autofocus
      />
    </div>

    <div class="form-group">
      <label for="page-path-input">Path</label>
      <input
        id="page-path-input"
        type="text"
        [(ngModel)]="path"
        placeholder="e.g. /dashboard"
        (keydown.enter)="onSubmit()"
      />
    </div>

    <label class="ui-check layout-check" [class.disabled]="layoutExists()">
      <input type="checkbox" [checked]="layout()" [disabled]="layoutExists()" (change)="layout.set($any($event.target).checked)" />
      <span>
        Layout page
        <span class="hint">
          {{ layoutExists() ? 'This project already has one.' : 'Its widgets (navbar, sidebar, …) show on every page.' }}
        </span>
      </span>
    </label>
  </div>

  <div class="modal-actions">
    <app-button color="neutral" variant="ghost" (click)="onCancel()">Cancel</app-button>
    <app-button
      color="primary"
      variant="solid"
      (click)="onSubmit()"
      [disabled]="!valid()"
    >
      Create Page
    </app-button>
  </div>
</div>
