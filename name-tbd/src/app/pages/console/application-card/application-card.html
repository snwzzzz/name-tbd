<article class="application-card">
  <a class="open" [routerLink]="editorLink()" [title]="'Open ' + application().title">
    <h2 class="title">{{ application().title }}</h2>
    @if (application().description) {
      <p class="description">{{ application().description }}</p>
    }
    @if (application().lastModified) {
      <p class="edited">
        Edited {{ application().lastModified | date: 'medium' }}
        @if (application().lastModifiedBy) {
          by {{ application().lastModifiedBy }}
        }
      </p>
    }
  </a>
  <div class="actions">
    <button type="button" class="action" title="Rename" [attr.aria-label]="'Rename ' + application().title" (click)="rename.emit()">
      <svg lucidePencil></svg>
    </button>
    <button type="button" class="action" title="Duplicate" [attr.aria-label]="'Duplicate ' + application().title" (click)="duplicate.emit()">
      <svg lucideCopy></svg>
    </button>
    <button type="button" class="action danger" title="Delete" [attr.aria-label]="'Delete ' + application().title" (click)="remove.emit()">
      <svg lucideTrash2></svg>
    </button>
  </div>
</article>
