<main class="login">
  <section class="card" aria-labelledby="login-title">
    <h1 id="login-title">Sign in</h1>
    <p class="lead">Use your work or personal account to get to your apps.</p>

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <div class="providers">
      <button type="button" class="provider" (click)="signIn('google')">
        <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#ea4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.9 6.2C12.5 13.6 17.8 9.5 24 9.5z" />
          <path fill="#4285f4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9h12.4c-.5 2.9-2.2 5.4-4.6 7l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z" />
          <path fill="#fbbc05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C1 16.6 0 20.2 0 24s1 7.4 2.7 10.8l7.9-6.2z" />
          <path fill="#34a853" d="M24 48c6.5 0 11.9-2.1 15.8-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.2 0-11.5-4.2-13.4-9.9l-7.9 6.2C6.6 42.6 14.6 48 24 48z" />
        </svg>
        Continue with Google
      </button>
      <button type="button" class="provider" (click)="signIn('microsoft')">
        <svg class="logo" viewBox="0 0 21 21" aria-hidden="true">
          <rect x="1" y="1" width="9" height="9" fill="#f25022" />
          <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
          <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
          <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
        </svg>
        Continue with Microsoft
      </button>
    </div>
  </section>
</main>
