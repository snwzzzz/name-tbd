<div class="confirm-dialog">
  <div class="dialog-header">
    <h3 class="dialog-title" id="confirm-dialog-title">{{ data.title }}</h3>
  </div>

  <div class="dialog-body">
    <p class="dialog-message" id="confirm-dialog-desc">{{ data.message }}</p>
  </div>

  <div class="dialog-actions">
    @if (!data.hideCancel) {
      <app-button
        color="neutral"
        variant="ghost"
        (click)="onCancel()"
      >
        {{ data.cancelText || 'Cancel' }}
      </app-button>
    }

    <app-button
      [color]="confirmButtonColor()"
      variant="solid"
      (click)="onConfirm()"
    >
      {{ data.confirmText || 'Confirm' }}
    </app-button>
  </div>
</div>
