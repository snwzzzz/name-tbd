<button
  #trigger
  type="button"
  class="ui-select-trigger"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  [class.open]="open()"
  [disabled]="disabled()"
  [attr.aria-expanded]="open()"
  aria-haspopup="listbox"
  (click)="toggle()"
  (keydown)="onKeydown($event)">
  @if (leadingIcon(); as lead) {
    <span class="lead-icon"><ng-container *ngComponentOutlet="lead"></ng-container></span>
  }
  <span class="value" [class.placeholder]="!selected()">{{ selected()?.label ?? placeholder() }}</span>
  <span class="chevron"><svg lucideChevronDown></svg></span>
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayMinWidth]="panelWidth()"
  (overlayOutsideClick)="onOutsideClick($event)"
  (detach)="close()">
  <ul class="ui-select-panel" [class.compact]="size() === 'sm'" role="listbox">
    @for (option of options(); track option.value; let i = $index) {
      <li
        role="option"
        class="ui-select-option"
        [class.selected]="option.value === value()"
        [class.active]="i === activeIndex()"
        [attr.aria-selected]="option.value === value()"
        (mouseenter)="activeIndex.set(i)"
        (mousedown)="$event.preventDefault()"
        (click)="choose(option)">
        @if (option.icon) {
          <span class="option-icon"><ng-container *ngComponentOutlet="option.icon"></ng-container></span>
        }
        <span class="option-label">{{ option.label }}</span>
        @if (option.value === value()) {
          <span class="check"><svg lucideCheck></svg></span>
        }
      </li>
    } @empty {
      <li class="ui-select-empty">Nothing to choose from</li>
    }
  </ul>
</ng-template>
