<div
  class="tabs-container"
  cdkDropList
  cdkDropListOrientation="horizontal"
  [cdkDropListAutoScrollDisabled]="true"
  (cdkDropListDropped)="onDropCdk($event)"
>
  @for (tab of tabs(); track tab.id) {
    <div class="tab" cdkDrag [class.active]="activeTabId() === tab.id" (click)="selectTab(tab.id)">
      <!-- Custom drag placeholder for smooth animations -->
      <div *cdkDragPlaceholder class="tab cdk-drag-placeholder"></div>

      <div class="content">
        <span class="title">{{ tab.title }}</span>
        <span class="mode">{{ tab.mode || 'edit' }}</span>
      </div>
      <button class="close-btn" (click)="closeTab(tab.id, $event)">
        <div>×</div>
      </button>
    </div>
  }
  <div class="add-button-container">
    <button class="add-tab-btn" (click)="addTab()">+</button>
  </div>
</div>
