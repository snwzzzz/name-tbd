<nav class="navbar">
  <div class="logo" routerLink="/">My IDE</div>
  
  <div class="nav-links">
    <a routerLink="/console" routerLinkActive="active">Console</a>
    <a routerLink="/poc" routerLinkActive="active">POC</a>
    <a routerLink="/editor" routerLinkActive="active">Editor</a>
  </div>

  <div class="actions">
    <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (isDarkMode) {
        ☀️ Light
      } @else {
        🌙 Dark
      }
    </button>
    <!-- User icon, settings, etc -->
  </div>
</nav>
