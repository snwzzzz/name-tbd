<nav class="navbar">
  <div class="left-section">
    <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (isDarkMode) {
        <svg lucideSun></svg>
      } @else {
        <svg lucideMoon></svg>
      }
    </button>
    <div class="logo" routerLink="/">My IDE</div>
  </div>

  <div class="center-section">
    <div class="search-bar">
      <svg lucideSearch class="search-icon"></svg>
      <input type="text" placeholder="Search...">
    </div>
  </div>

  <div class="actions">
    <button class="export-btn" (click)="exportPage()" aria-label="Export HTML">
      <svg lucideDownload></svg>
      Export
    </button>
  </div>
</nav>
