<div class="w-field">
  @if (label(); as label) {
    <label class="w-label" [class.w-required]="required()" [for]="fieldId()">{{ label }}</label>
  }
  <input
    type="date"
    class="w-box"
    [id]="fieldId()"
    [value]="value()"
    [attr.min]="min()"
    [attr.max]="max()"
    [readOnly]="!session.live()"
    [attr.aria-label]="label() ? null : 'Date'"
    [attr.aria-required]="required()"
    [attr.aria-invalid]="!!error()"
    [attr.aria-describedby]="error() ? errorId() : null"
    [attr.tabindex]="tabIndex()"
    (change)="setValue($any($event.target).value)" />
  @if (error(); as error) {
    <span class="w-error" [id]="errorId()" role="alert">{{ error }}</span>
  }
</div>
