<div class="w-field">
  @if (label(); as label) {
    <label class="w-label" [class.w-required]="required()" [for]="fieldId()">{{ label }}</label>
  }
  <textarea
    class="w-box"
    [id]="fieldId()"
    [value]="value()"
    [placeholder]="placeholder()"
    [attr.maxlength]="maxLength()"
    [readOnly]="!session.live()"
    [attr.aria-label]="label() ? null : placeholder() || 'Text'"
    [attr.aria-required]="required()"
    [attr.aria-invalid]="!!error()"
    [attr.aria-describedby]="error() ? errorId() : null"
    [attr.tabindex]="tabIndex()"
    (input)="onInput($any($event.target).value)"></textarea>
  @if (error(); as error) {
    <span class="w-error" [id]="errorId()" role="alert">{{ error }}</span>
  }
</div>
