<div class="ui-fields">
  <div class="ui-field">
    <label class="ui-field-label" for="button-label">Button label</label>
    <input
      id="button-label"
      type="text"
      class="ui-input"
      [ngModel]="text('label')"
      (ngModelChange)="updateProp('label', $event)"
    />
  </div>
</div>
