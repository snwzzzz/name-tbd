<div class="ui-fields">
  <div class="ui-field">
    <label class="ui-field-label" for="label-text">Label text</label>
    <textarea
      id="label-text"
      rows="3"
      class="ui-input"
      [ngModel]="text('text')"
      (ngModelChange)="updateProp('text', $event)"
    ></textarea>
  </div>

  <div class="ui-field">
    <label class="ui-field-label" for="label-color">Color</label>
    <div class="ui-color">
      <input id="label-color" type="color" [ngModel]="color()" (ngModelChange)="updateProp('color', $event)" />
      <span class="ui-color-value">{{ color() }}</span>
    </div>
  </div>
</div>
