@if (choices(); as choices) {
  <div class="column-choices" cdkDropList (cdkDropListDropped)="reorder($event)">
    @for (choice of choices; track choice.name) {
      <label class="ui-check column-choice" cdkDrag cdkDragLockAxis="y">
        <input
          type="checkbox"
          [checked]="choice.shown"
          [disabled]="choice.shown && shownCount() === 1"
          (change)="toggle(choice.name)" />
        <span class="column-name">{{ choice.name }}</span>
        <span class="drag-handle" cdkDragHandle title="Drag to reorder"><svg lucideGripVertical></svg></span>
      </label>
    }
  </div>
} @else {
  <p class="hint">Pick a data source to choose its columns.</p>
}
