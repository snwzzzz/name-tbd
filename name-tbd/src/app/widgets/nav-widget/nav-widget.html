<nav
  class="nav"
  [class]="'variant-' + variant()"
  [class.vertical]="vertical()"
  [class.live]="previewing()"
  [style.color]="color()"
  [style.background]="background()"
  [style.--nav-accent]="accentColor()"
  [style.--nav-on-accent]="onAccentColor()">
  @if (links().length) {
    <ul>
      @for (page of links(); track page.id) {
        <li>
          <a
            [href]="page.path"
            [class.current]="isCurrent(page)"
            [attr.aria-current]="isCurrent(page) ? 'page' : null"
            (click)="follow($event, page)">{{ page.name }}</a>
        </li>
      }
    </ul>
  } @else if (!previewing()) {
    <!-- A hint for the editor; the running app shows an empty menu -->
    <span class="empty">Pick pages in the properties panel</span>
  }
</nav>
