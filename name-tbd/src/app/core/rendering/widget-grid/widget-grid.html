<ng-container *ngTemplateOutlet="grid; context: { $implicit: items(), columns: columns, rows: rows, root: true }" />

<!-- One grid of cells; containers nest their own grid (as many cells as they're big, no margins).
     Like on the canvas, only the root grid's widgets are inset, and containers fill their cells. -->
<ng-template #grid let-items let-columns="columns" let-rows="rows" let-root="root">
  <div
    class="layout-grid"
    [class.root]="root"
    [style.grid-template-columns]="'repeat(' + columns + ', 1fr)'"
    [style.grid-template-rows]="'repeat(' + rows + ', 1fr)'">
    @for (item of items; track key(item)) {
      <div
        class="cell"
        [style.grid-column]="((item.x ?? 0) + 1) + ' / span ' + (item.w ?? 1)"
        [style.grid-row]="((item.y ?? 0) + 1) + ' / span ' + (item.h ?? 1)"
        [style.padding.px]="root && !isContainer(item) ? margin : 0">
        @if (isContainer(item)) {
          <ng-container *ngTemplateOutlet="grid; context: { $implicit: item.children ?? [], columns: item.w ?? 1, rows: item.h ?? 1, root: false }" />
        } @else {
          <div class="widget">
            <ng-container *ngComponentOutlet="component(item); inputs: { id: key(item), props: props(item) }" />
          </div>
        }
      </div>
    }
  </div>
</ng-template>
