<nav class="navbar">
  <div class="left-section">
    <button
      type="button"
      class="theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (isDark()) {
        <svg lucideSun></svg>
      } @else {
        <svg lucideMoon></svg>
      }
    </button>
    <div class="logo" routerLink="/">My IDE</div>
  </div>

  <div class="center-section">
    <div class="search-bar">
      <svg lucideSearch class="search-icon"></svg>
      <input type="text" placeholder="Search..." />
    </div>
  </div>

  <div class="actions">
    <button
      type="button"
      class="export-btn"
      [disabled]="!activeTabId()"
      [title]="activeTabId() ? 'Download this page as HTML' : 'Open a page to export it'"
      (click)="exportPage()">
      <svg lucideDownload></svg>
      Export
    </button>
  </div>
</nav>
