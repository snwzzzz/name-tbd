<nav class="navbar">
  <div class="left-section">
    <button
      type="button"
      class="theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (isDark()) {
        <svg lucideSun></svg>
      } @else {
        <svg lucideMoon></svg>
      }
    </button>
    <div class="logo" routerLink="/">My IDE</div>
  </div>

  <div class="center-section">
    <div class="search-bar">
      <svg lucideSearch class="search-icon"></svg>
      <input type="text" placeholder="Search..." />
    </div>
  </div>

  <div class="actions">
    @if (busy()) {
      <!-- Only shows once a request takes a moment (see navbar.scss), so quick ones don't flicker -->
      <span class="busy" role="status" aria-label="Loading"><span class="ui-spinner"></span></span>
    }
    <button type="button" class="icon-action" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts" (click)="showShortcuts()">
      <svg lucideKeyboard></svg>
    </button>
    <button
      type="button"
      class="export-btn"
      title="Download the app as one HTML file that runs on its own"
      (click)="exportApp()">
      <svg lucideDownload></svg>
      Export
    </button>
    <app-user-menu />
  </div>
</nav>
