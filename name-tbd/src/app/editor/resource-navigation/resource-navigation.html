<aside
  class="resource-navigation"
  [class.expanded]="expanded()"
  [class.resizing]="resizing()"
  [style.width.px]="renderedWidth()">
  <div class="icon-bar">
    @for (tab of tabs; track tab.id) {
      <app-icon-button [icon]="tab.icon" [selected]="activeTab() === tab.id" [attr.title]="tab.label" (click)="selectTab(tab.id)" />
    }
  </div>

  <div class="content">
    @if (activeDefinition(); as tab) {
      <ng-container *ngComponentOutlet="tab.component" />
    }
  </div>

  @if (expanded()) {
    <div class="resizer" appResizeHandle side="left" [min]="minWidth" [max]="maxWidth" [(width)]="width" [(resizing)]="resizing"></div>
  }
</aside>
