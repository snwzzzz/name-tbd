<div
  class="tabs-container"
  cdkDropList
  cdkDropListOrientation="horizontal"
  [cdkDropListAutoScrollDisabled]="true"
  (cdkDropListDropped)="onDrop($event)"
>
  @for (tab of tabs(); track tab.id) {
    <div class="tab" cdkDrag [class.active]="activeTabId() === tab.id" (click)="selectTab(tab.id)">
      <div class="content">
        <span class="title">{{ tab.title }}</span>
        <span class="mode">{{ tab.mode || 'edit' }}</span>
      </div>
      <button type="button" class="close-btn" title="Close tab" aria-label="Close tab" (click)="closeTab(tab.id, $event)">×</button>
    </div>
  }
  <div class="add-button-container">
    <button type="button" class="add-tab-btn" title="New tab" aria-label="New tab" (click)="addTab()">+</button>
  </div>
</div>
