<aside
  class="inspector-panel"
  [class.expanded]="expanded()"
  [class.resizing]="resizing()"
  [style.width.px]="renderedWidth()">
  <div class="icon-bar">
    <app-icon-button [icon]="editIcon" [selected]="activeTab() === 'edit'" (click)="selectTab('edit')" />
    <app-icon-button [icon]="layersIcon" [selected]="activeTab() === 'layers'" (click)="selectTab('layers')" />
  </div>

  <div class="content">
    @switch (activeTab()) {
      @case ('edit') { <app-properties-panel /> }
      @case ('layers') { <div class="placeholder-panel">Layers Panel (Coming Soon)</div> }
    }
  </div>

  @if (expanded()) {
    <div class="resizer" appResizeHandle side="right" [min]="minWidth" [max]="maxWidth" [(width)]="width" [(resizing)]="resizing"></div>
  }
</aside>
