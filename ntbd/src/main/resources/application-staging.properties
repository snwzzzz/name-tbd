# A deployed backend (SPRING_PROFILES_ACTIVE=staging), behind the deploy's proxy (deploy/compose.yaml):
# PostgreSQL from the environment, JSON logs, HTTPS-only cookies, no API docs.

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# The site is HTTPS only
server.servlet.session.cookie.secure=true

# One JSON object per log line (Elastic Common Schema), with requestId and userId (RequestContextFilter)
logging.structured.format.console=ecs

# No API docs or database console in a deploy
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.h2.console.enabled=false

sentry.environment=${SENTRY_ENVIRONMENT:staging}
