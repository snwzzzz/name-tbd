spring.application.name=ntbd

spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=validate


#spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=create.sql
#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-source=metadata





# Where the editor runs; sign-in redirects back there
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
# Behind a proxy (ng serve, the reverse proxy on a deploy), build URLs from X-Forwarded-* headers
server.forward-headers-strategy=framework
# Origins allowed to call the API cross-origin, comma-separated. Empty: none (editor and API share an origin)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# The session cookie: HttpOnly, not sent on cross-site requests, HTTPS-only where the site is HTTPS
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Sign-in with OIDC. The placeholders let the app start without credentials; sign-in itself
# needs real ones from Google Cloud and Microsoft Entra (redirect URI: <editor origin>/login/oauth2/code/<google|microsoft>)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.microsoft.provider=microsoft
spring.security.oauth2.client.registration.microsoft.client-name=Microsoft
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
# Explicit endpoints instead of issuer-uri: no discovery call at startup, and "common" accepts every
# tenant (the token's issuer names the tenant, so identities stay per tenant). MICROSOFT_TENANT limits it to one.
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/${MICROSOFT_TENANT:common}/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/${MICROSOFT_TENANT:common}/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/${MICROSOFT_TENANT:common}/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub

# Request limits (RequestLimitsFilter): rates per minute, body sizes in bytes
app.limits.sign-in-per-minute=20
app.limits.writes-per-minute=120
app.limits.executions-per-minute=10
app.limits.max-request-bytes=1048576
app.limits.max-data-source-bytes=10485760

# Health check for the deploy (only "UP"/"DOWN", no details)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Error tracking: off unless SENTRY_DSN is set. Only our user id is sent (SentryUser), no personal data.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:development}
sentry.send-default-pii=false
