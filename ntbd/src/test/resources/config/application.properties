# Overrides for tests and dev runs. It lives in config/ so it adds to the main application.properties
# (same-named files on the classpath would hide it) and wins over it.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=true;DEFAULT_NULL_ORDERING=HIGH
spring.test.database.replace=none

# Dev and test runs also get the sample app (branch -1); a real deploy only runs db/migration
spring.flyway.locations=classpath:db/migration,classpath:db/devdata

# Local development: the OpenAPI spec (for generating the editor's API client) and Swagger UI without sign-in
app.security.public-api-docs=true
# Local development: sign in as any email on the login page, without Google or Microsoft (DevSignInController)
app.security.dev-sign-in=true
# Tests send many requests from one address in a few seconds; RequestLimitsTest checks the limits themselves
app.limits.sign-in-per-minute=100000
app.limits.writes-per-minute=100000
app.limits.executions-per-minute=100000
